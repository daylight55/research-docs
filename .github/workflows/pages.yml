name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - contents/**
      - src/**
      - package.json
      - package-lock.json
      - astro.config.mjs
      - tsconfig.json
      - themes/**
      - scripts/build-pages-site.sh
      - .github/workflows/pages.yml
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - contents/**
      - src/**
      - package.json
      - package-lock.json
      - astro.config.mjs
      - tsconfig.json
      - themes/**
      - scripts/build-pages-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  pages: read
  pull-requests: write

concurrency:
  group: pages-deploy
  queue: max

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: npm ci

      - name: Test site structure
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: npm test

      - name: Build main site
        if: github.event_name != 'pull_request'
        env:
          SITE_BASE: /research-docs/
          OUT_DIR: site
        run: scripts/build-pages-site.sh site

      - name: Build pull request preview site
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          SITE_BASE: /research-docs/pr-preview/pr-${{ github.event.number }}/
          OUT_DIR: site
        run: scripts/build-pages-site.sh site

      - name: Deploy main site
        id: deploy-main
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview
          force: false
          commit-message: Deploy GitHub Pages site for ${{ github.sha }}

      - name: Wait for main site deployment
        if: github.event_name != 'pull_request' && steps.deploy-main.outputs.deployment-status != 'failed'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: branch } = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/gh-pages",
            });
            const targetSha = branch.object.sha;
            const deadline = Date.now() + 10 * 60 * 1000;

            core.info(`Waiting for GitHub Pages build for ${targetSha}`);

            while (Date.now() < deadline) {
              const { data: builds } = await github.request(
                "GET /repos/{owner}/{repo}/pages/builds",
                {
                  owner,
                  repo,
                  per_page: 100,
                },
              );
              const build = builds.find(({ commit }) => commit === targetSha);

              if (!build) {
                core.info("Pages build has not started yet");
              } else if (build.status === "built") {
                core.info(`Pages build ${build.id} completed`);
                return;
              } else if (build.status === "errored") {
                core.setFailed(`Pages build ${build.id} failed`);
                return;
              } else {
                core.info(`Pages build ${build.id} is ${build.status}`);
              }

              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            core.setFailed(`Timed out waiting for Pages build for ${targetSha}`);

      - name: Deploy pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          wait-for-pages-deployment: true
          comment: true
          qr-code: false
